name: Cartes du profil

# Redessine les cartes chaque matin avec les vraies contributions, et après chaque
# modification de donnees/profil.json ou des scripts. Lancement manuel possible.
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["donnees/profil.json", "donnees/icones.json", "scripts/**", "polices/**", ".github/workflows/cartes.yml"]

permissions:
  contents: write

jobs:
  cartes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - run: pip install -r scripts/requirements.txt
      - name: Contributions
        run: python scripts/contributions.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Cartes et README
        run: python scripts/cartes.py
      # Un commit fait avec GITHUB_TOKEN ne relance pas le workflow : pas de boucle.
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartes README.md donnees/contributions.json
          git diff --cached --quiet || { git commit -m "Redessine les cartes du profil"; git push; }
